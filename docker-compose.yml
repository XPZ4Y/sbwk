# SBWK — Sleepy Bot with Keys
# Full "middleman" stack + developer onboarding control plane.
# Copy .env.example to .env and set the shared secrets before `docker compose up`.
services:
  # 1. The application Server — our tiny zero-dep dummy backend (replaces ~200MB httpbin).
  #    Shares node:22-alpine with the rest of the stack: no extra base-image pull.
  server:
    build: ./services/dummy-server
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: "8000"
      FAIL_MODE: normal
    restart: unless-stopped

  # 2. The Edge — reverse proxy + anomaly detector. Clients hit this.
  middleware:
    build: ./services/middleware
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      TARGET_SERVER_URL: http://server:8000
      AGENT_CORE_URL: http://agent-core:4200
      AGENT_CORE_TOKEN: ${AGENT_CORE_TOKEN}
      MIDDLEWARE_ADMIN_TOKEN: ${MIDDLEWARE_ADMIN_TOKEN}
      DETECT_STATUS_MIN: ${DETECT_STATUS_MIN:-500}
      DETECT_SLOW_MS: ${DETECT_SLOW_MS:-2000}
      DETECT_UPSTREAM_ERRORS: "true"
      DISPATCH_COOLDOWN_MS: ${DISPATCH_COOLDOWN_MS:-15000}
      # Lazy two-stage gate (opt-in). Immediate = today's per-request dispatch.
      DETECT_MODE: ${DETECT_MODE:-immediate}
      BATCH_MIN_BAD: ${BATCH_MIN_BAD:-5}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-60000}
      BATCH_MAX_SIZE: ${BATCH_MAX_SIZE:-50}
      BATCH_FLUSH_TIMEOUT_MS: ${BATCH_FLUSH_TIMEOUT_MS:-0}
      BATCH_TIMEOUT_MS: ${BATCH_TIMEOUT_MS:-25000}
      LIQUID_BATCH_FALLBACK: ${LIQUID_BATCH_FALLBACK:-investigate}
    depends_on:
      - server
      - agent-core
    restart: unless-stopped

  # 3. The Brain — investigates, reasons, suggests fixes, escalates.
  agent-core:
    build: ./services/agent-core
    ports:
      - "4200:4200" # bearer-protected; exposed for inspection/demo convenience
    environment:
      NODE_ENV: production
      PORT: "4200"
      AGENT_CORE_TOKEN: ${AGENT_CORE_TOKEN}
      AGENT_MODE: ${AGENT_MODE:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Prompt engineering (prompts.mjs profiles + overrides).
      GROQ_PROMPT_PROFILE: ${GROQ_PROMPT_PROFILE:-balanced}
      GROQ_SYSTEM_PROMPT: ${GROQ_SYSTEM_PROMPT:-}
      GROQ_PROMPT_TEMPLATE: ${GROQ_PROMPT_TEMPLATE:-}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-}
      # Liquid d1 triage router (engineer intervention vs Groq).
      LIQUID_API_KEY: ${LIQUID_API_KEY:-}
      LIQUID_MODEL: ${LIQUID_MODEL:-d1}
      LIQUID_BASE_URL: ${LIQUID_BASE_URL:-https://api.liquid.ai}
      LIQUID_DECISIONS_PATH: ${LIQUID_DECISIONS_PATH:-/decisions/v1/systemone}
      LIQUID_TIMEOUT_MS: ${LIQUID_TIMEOUT_MS:-8000}
      LIQUID_ENABLED: ${LIQUID_ENABLED:-true}
      LIQUID_ROUTE_POLICY: ${LIQUID_ROUTE_POLICY:-}
      # Lazy two-stage gate: Liquid decides if a batch of bad requests matters.
      BATCH_LIQUID_ANOMALY_THRESHOLD: ${BATCH_LIQUID_ANOMALY_THRESHOLD:-0.6}
      LIQUID_BATCH_FALLBACK: ${LIQUID_BATCH_FALLBACK:-investigate}
      BATCH_MAX_INCIDENTS: ${BATCH_MAX_INCIDENTS:-50}
      AI_DEBUG: ${AI_DEBUG:-true}
      CONNECTOR_URL: http://agent-connector:4100
      CONNECTOR_API_TOKEN: ${CONNECTOR_API_TOKEN}
      INVESTIGATE_SERVICES: database,auth,external_api
      CODEBASE_PATH: /codebase
      DRY_RUN: "true"
      AUTO_ROLLBACK: "true"
      MONITORING_ACTIVE: "true"
      ESCALATION_CONFIDENCE_THRESHOLD: ${ESCALATION_CONFIDENCE_THRESHOLD:-0.8}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      DATA_DIR: /data
    volumes:
      - ${TARGET_CODEBASE_PATH:-./services/dummy-server}:/codebase:ro
      - agent-core-data:/data
    depends_on:
      - agent-connector
    restart: unless-stopped

  # 4. The Hands — read-only dependency diagnostics. Internal only.
  agent-connector:
    build: ./services/agent-connector
    environment:
      NODE_ENV: production
      PORT: "4100"
      CONNECTOR_API_TOKEN: ${CONNECTOR_API_TOKEN}
      CONNECTOR_MODE: ${CONNECTOR_MODE:-mock}
    restart: unless-stopped

  # 5. Developer onboarding control plane — serves the UI and configures the stack.
  control-plane:
    build: ./services/control-plane
    ports:
      - "4300:4300"
    environment:
      NODE_ENV: production
      PORT: "4300"
      MIDDLEWARE_URL: http://middleware:8080
      MIDDLEWARE_ADMIN_TOKEN: ${MIDDLEWARE_ADMIN_TOKEN}
      CONNECTOR_URL: http://agent-connector:4100
      CONNECTOR_API_TOKEN: ${CONNECTOR_API_TOKEN}
      AGENT_CORE_URL: http://agent-core:4200
      AGENT_CORE_TOKEN: ${AGENT_CORE_TOKEN}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
      CONTROL_PLANE_SECRET: ${CONTROL_PLANE_SECRET:-}
      CONTROL_PLANE_PASSWORD: ${CONTROL_PLANE_PASSWORD} 
      BLOCK_PRIVATE_NETWORKS: ${BLOCK_PRIVATE_NETWORKS:-false}
      DEFAULT_TARGET_URL: http://server:8000
      DATA_DIR: /data
    volumes:
      - control-plane-data:/data
    depends_on:
      - middleware
      - agent-core
      - agent-connector
    restart: unless-stopped

volumes:
  agent-core-data:
  control-plane-data:
